[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "textutils-clovistiemtore"
version = "0.1.0"
description = "An open-source Python library for common text-processing operations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["text", "utilities", "text-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/clovisTiemtore/textutils"
Repository = "https://github.com/clovisTiemtore/textutils"
Issues = "https://github.com/clovisTiemtore/textutils/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "ruff"]

[tool.setuptools.packages.find]
include = ["textutils*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["textutils"]
addopts = ["--cov=textutils", "--cov-report=term-missing"]

[tool.coverage.run]
branch = true
core = "pytrace"
source = ["textutils"]
omit = ["textutils/**/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["D"]
