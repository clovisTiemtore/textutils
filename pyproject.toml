[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=textutils", "--cov-report=term-missing"]

[tool.coverage.run]
branch = true
core = "pytrace"
source = ["textutils"]

[tool.coverage.report]
show_missing = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
